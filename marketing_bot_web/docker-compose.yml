services:
  backend:
    build:
      context: ..
      dockerfile: marketing_bot_web/backend/Dockerfile
    container_name: marketing-bot-backend
    env_file:
      - ../.env
    ports:
      - "8000:8000"
    volumes:
      - ../db:/app/db
      - ../logs:/app/logs
      - ../.env:/app/.env
    environment:
      - PYTHONUNBUFFERED=1
      - MARKETING_BOT_TRUST_PROXY_HEADERS=true
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build: ./frontend
    container_name: marketing-bot-frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend/src:/app/src
    depends_on:
      - backend
    command: npm run dev -- --host

  nginx:
    image: nginx:alpine
    container_name: marketing-bot-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - backend
      - frontend
